[project]
name = "async-pytest-httpserver"
version = "2.1.0"
description = "Async mock HTTP server for pytest, built on top of aiohttp."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name="krylosov-aa", email="krylosov.andrew@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.11.0",
    "pytest>=8.4",
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
]

[dependency-groups]
dev = [
    "complexipy>=5.5.0",
    "mypy>=1.19.0",
    "pytest-cov>=7.0.0",
    "radon>=6.0.1",
    "ruff>=0.14.8",
    "wemake-python-styleguide>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["async_pytest_httpserver"]

[project.entry-points."pytest11"]
async-pytest-httpserver = "async_pytest_httpserver.fixtures"

[project.urls]
Homepage = "https://github.com/krylosov-aa/async-pytest-httpserver"

[tool.complexipy]
max-complexity-allowed = 10
exclude-patterns = [
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff]
line-length = 79
target-version = "py310"
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors: PEP 8 style errors
    "F",      # Pyflakes: detects undefined names, unused imports, and other logical issues
    "I",      # isort: import sorting and formatting
    "B",      # flake8-bugbear: likely bugs and design problems
    "UP",     # pyupgrade: modernize syntax for newer Python versions
    "SIM",    # flake8-simplify: simplify code constructs
    "C901",   # mccabe: function/method complexity checks
    "S",      # flake8-bandit: security checks
    "ASYNC",  # flake8-async: async/await best practices
    "T10",    # flake8-debugger: no breakpoint/pdb
    "T20",    # flake8-print: no print() in production
    "PERF",   # Perflint: performance anti-patterns
    "RUF",    # Ruff-specific rules
    "DTZ",    # flake8-datetimez: timezone-aware datetime
    "TCH",    # flake8-type-checking: TYPE_CHECKING imports
    "C4",     # flake8-comprehensions: comprehension improvements
]


[tool.ruff.lint.per-file-ignores]
"{examples,tests}/**" = [
    "S101",   # assert is standard in pytest
    "T20",    # print() allowed in tests
    "S105",   # mock/test credential strings are not real passwords
    "DTZ005", # datetime.now() without tz is fine in tests
    "DTZ011", # date.today() without tz is fine in tests
    "PERF",   # performance rules not applied to test code
    "RUF028", # fmt: off inside function calls used in legacy test fixtures
    "TCH",    # TYPE_CHECKING blocks are unnecessary noise in test files
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.radon]
exclude = "venv/*,.venv/*"
cc_min = "C"
show_complexity = true
average = true

[tool.coverage.run]
source = ["async_pytest_httpserver"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
