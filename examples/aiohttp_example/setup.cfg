[flake8]
exclude = .venv
ignore=
; Uppercase class attribute constants (BASE_URL) are a valid pattern
        , WPS115
; Found using `@staticmethod`
        , WPS602

per-file-ignores =
    tests/**:
; Found underscored number name
        , WPS114
; Found overused expression
        , WPS204
; Found string literal over-use
        , WPS226
; Magic numbers are fine in tests
        , WPS432
; Float comparison is fine in tests
        , WPS459
; W503 line-break before binary operator
        , W503
; Too many local variables in tests
        , WPS210
; Too many empty lines inside def (blank lines between AAA sections)
        , WPS473
; Vague import names fine in examples
        , WPS347
; Found nested function (fixtures use nested funcs)
        , WPS430
; Found too many await expressions: > 5
        , WPS217
; Found wrong variable name
        , WPS110
; Found too many module members: > 7
        , WPS202
; Found `await` in `for` loop
        , WPS476